# Sherlock homepage story direction: static preview, never indexed.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  location / { try_files $uri $uri/ /index.html; }
  location /assets/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "public, max-age=3600"; }
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
