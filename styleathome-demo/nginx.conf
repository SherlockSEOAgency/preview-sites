server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_comp_level 6; gzip_min_length 256;
  gzip_types text/css application/javascript image/svg+xml application/json;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  # HTML en het oude, niet-versie-gebonden CSS-pad: altijd hervalideren
  add_header Cache-Control "no-cache" always;
  location / { try_files $uri $uri/ =404; }
  # bestanden met een inhoudshash in de naam: nooit veranderend, lang te cachen
  location ~* "^/(img|fonts|css)/.+\\.[0-9a-f]{8}\\.(webp|woff2|svg|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
