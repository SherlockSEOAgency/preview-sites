server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  gzip on; gzip_comp_level 6; gzip_min_length 256;
  gzip_types text/css application/javascript image/svg+xml application/json;
  location / { try_files $uri $uri/ =404; }
  location ~* \.(webp|woff2|svg)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /css/style.css { expires 1d; add_header Cache-Control "public, max-age=86400"; add_header X-Robots-Tag "noindex, nofollow" always; }
}
