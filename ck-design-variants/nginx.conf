# One app, five hostnames. ck-design-{a..d}.preview serve /a../d at their root; ck-design.preview serves the index.
# Path routes (/a/, /b/ ...) work on every host too. Engine + skin assets live at /_engine and /_skin on all of them.
map $host $variant_root {
    ~^ck-design-a\. /usr/share/nginx/html/a;
    ~^ck-design-b\. /usr/share/nginx/html/b;
    ~^ck-design-c\. /usr/share/nginx/html/c;
    ~^ck-design-d\. /usr/share/nginx/html/d;
    default         /usr/share/nginx/html;
}
server {
    listen 80;
    index index.html;
    root $variant_root;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /_engine/ { alias /usr/share/nginx/html/_engine/; }
    location /_skin/   { alias /usr/share/nginx/html/_skin/; }
    location = /build.py { return 404; }
    location /src/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
