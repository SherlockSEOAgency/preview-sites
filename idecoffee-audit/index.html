function split(title, head, rows, note, src){
  if(!rows || !rows.length){
    return `<div class="nogo">${esc(title)} wordt niet getoond: er is geen verdeling beschikbaar. Een totaal zonder verdeling zetten wij niet in een strategie.</div>`;
  }
  return `<h3 style="margin-top:22px">${esc(title)}</h3>
  <div class="tbl-wrap"><table class="data"><thead><tr>${head.map((h,i)=>`<th class="${i>0&&i<head.length-1?'num':''}">${esc(h)}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>{
    const cls = r[r.length-1]==="win"||r[r.length-1]==="bad" ? r[r.length-1] : "";
    const cells = cls ? r.slice(0,-1) : r;
    return `<tr class="${cls}">${cells.map((c,i)=>`<td class="${i>0&&i<head.length-1?'num':''}">${esc(c)}</td>`).join("")}</tr>`;
  }).join("")}</tbody></table></div>
  ${note?`<p class="small" style="margin-top:9px">${esc(note)}</p>`:""}
  <p class="srcline">${esc(src)}</p>`;
}
