<!--
  ECHTE-KLANT AUDIT (nulmeting) — CK Service (ckservice.be)
  ---------------------------------------------------------
  Alle cijfers zijn LIVE uit Sherlock OS op 10-08-2026 (GSC 90d, GA4 90d, keyword_data,
  topics/relevance). Niets is verzonnen. Waar een bron nog niet uitleest, staat dat
  eerlijk ("koppeling herstellen" / "nog niet gemeten"), nooit een verzonnen getal.
  Trend = leeg: dit is de eerste meting (nulmeting/baseline).

  Verwerkte feedback (Jef, 10/8): klant-taal, geen jargon; "geen webshop" weg; doel &
  contactwijze samengevoegd + herkomst getoond; richtcijfer klein + tooltip; €-onderbouwing
  = CPC × gemiste vraag (advertentiewaarde), exact zodra conversiewaarde gemeten;
  vaste volgorde techniek→content→autoriteit met verkooppagina's/lokaal VROEG;
  planning = "aan te passen in samenspraak met uw consultant"; visualisaties toegevoegd;
  detaildata → link naar platform.
-->
<style>

.toc{list-style:none;padding:0;margin:14px 0 0}

.sbar .nm{font-family:var(--font-head);font-weight:700;font-size:.94rem}

.tag.ok{background:var(--amber-tint);color:#8a6400}

.tag.na{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}

.stack{list-style:none;padding:0;margin:8px 0 0}

.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}

.col{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

.legend{font-size:.86rem}
