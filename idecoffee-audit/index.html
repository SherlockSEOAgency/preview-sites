<title>Website-audit Idé Coffee Systems</title>
<meta name="robots" content="noindex, nofollow">
<!--
  KLANTRAPPORT: Idé Coffee Systems (idecoffee.be)
  ================================================
  Bouwregel (platformpatroon, niet klantspecifiek):
  EEN CIJFER MAG NIET RENDEREN ZONDER ONDERBOUWING EN ZONDER ADVIES.
  Elke dimensie in DATA draagt verplicht:
    meting[]  = waarnemingen met waarde, bron en periode
    zegt      = wat het cijfer betekent
    zegt_niet = wat het cijfer NIET zegt (scopegrens)
    advies[]  = wat de klant hiermee doet
  De renderer weigert een score te tonen als meting[] of advies[] ontbreekt
  (zie functie dimSection): dan verschijnt een zichtbare melding in plaats van
  een net ogend, nergens op steunend cijfer.

  HERKOMST VAN DE CIJFERS
  - Dimensiescores D1..D9 en de totaalscore: Sherlock OS audit-snapshot,
    uitgelezen 16-08-2026. Niet met de hand bijgesteld.
  - Zoekdata: Search Console, sc-domain:idecoffee.be, 15-05-2026 t/m 12-08-2026.
  - Gedrag en aanvragen: analytics-property 359999097, 90 dagen t/m 16-08-2026
    (afwijkende periode, staat expliciet in het rapport).
  - Zoekwoordwaarde (CPC, volume): laatste verrijking in het platform.
  Wat niet gemeten is, krijgt geen cijfer en wordt niet als nul geteld.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#662483; --green:#6BB869; --white:#FFFFFF;
  --ink:#232326; --muted:#6B6B6B; --line:#E6E6EA; --surface:#F6F6F8;
  --green-tint:rgba(107,184,105,.14); --purple-tint:rgba(102,36,131,.08);
  --amber:#B8860B; --amber-tint:rgba(184,134,11,.12); --red:#b22828;
  --red-tint:rgba(178,40,40,.10);
  --font-head:"Raleway",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-body:"Open Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --shadow:0 1px 2px rgba(16,16,20,.05),0 8px 26px rgba(16,16,20,.07);
}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:#EAEAEE;color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.62}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;color:var(--ink)}
h1{font-size:2.6rem;line-height:1.07}h2{font-size:1.5rem;line-height:1.18}h3{font-size:1.14rem}h4{font-size:1rem}
p{margin:.55rem 0}a{color:var(--purple);font-weight:600}
.deck{max-width:1000px;margin:0 auto;padding:26px 16px 64px}
.page{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 24px;padding:44px 48px;position:relative;overflow:hidden}
@media(max-width:680px){.page{padding:30px 22px}.cover .in{padding:34px 24px 32px}.cover .sliver{width:60%}}
.kicker{font-family:var(--font-head);font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;margin:0 0 8px}
.lead{font-size:1.05rem;color:#3c3c40;max-width:68ch}
.small{font-size:.85rem;color:var(--muted)}
.src{font-size:.74rem;color:var(--muted)}

/* cover */
.cover{background:var(--purple);color:#fff;padding:0;border:none}
.cover .in{position:relative;z-index:2;padding:56px 50px 52px}
.cover h1{color:#fff;margin:.4rem 0 .5rem}
.cover .url{font-family:var(--font-head);font-weight:700;color:var(--green);font-size:1.35rem}
.cover .company{color:rgba(255,255,255,.84);font-size:1.02rem;margin-top:2px}
.cover .wm{font-family:var(--font-head);font-weight:700;color:#fff;font-size:1.25rem}
.cover .wm small{display:block;font-weight:500;font-size:.6rem;letter-spacing:.34em;color:var(--green);margin-top:2px}
.cover .meta{margin-top:32px;color:rgba(255,255,255,.92);font-size:.93rem}
.cover .meta b{color:#fff}
.cover .covernote{margin-top:14px;color:rgba(255,255,255,.80);font-size:.85rem;max-width:62ch;line-height:1.55}
.cover .sliver{position:absolute;top:0;right:0;width:44%;height:100%;background:linear-gradient(115deg,transparent 0 48%,var(--green) 48% 49%,transparent 49%);opacity:.9;z-index:1}
.cover svg.net{position:absolute;top:0;right:0;width:320px;height:210px;z-index:1;opacity:.5}

/* table of contents */
.toc{list-style:none;padding:0;margin:14px 0 0}
.toc li{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.toc li .no{font-family:var(--font-head);font-weight:700;color:var(--purple);width:26px;flex:none}
.toc li .tt{font-family:var(--font-head);font-weight:700}
.toc li .ds{color:var(--muted);font-size:.9rem;margin-left:auto;text-align:right;max-width:52%}
@media(max-width:680px){.toc li{flex-wrap:wrap}.toc li .ds{margin-left:40px;text-align:left;max-width:100%}}

/* totaalscore */
.total{display:grid;grid-template-columns:210px 1fr;gap:28px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:24px 26px;background:var(--surface);margin-top:6px}
@media(max-width:680px){.total{grid-template-columns:1fr;gap:14px}}
.total .fig{text-align:center}
.total .fig .n{font-family:var(--font-head);font-weight:700;font-size:4.4rem;line-height:1;color:var(--purple)}
.total .fig .n span{font-size:1.5rem;color:var(--muted)}
.total .fig .cap{font-family:var(--font-head);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.total h3{margin-bottom:4px}
.total p{font-size:.95rem;color:#3c3c40;margin:.4rem 0}

/* dimensietabel */
.sbar{display:grid;grid-template-columns:210px 120px 128px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sbar .nm{font-family:var(--font-head);font-weight:700;font-size:.94rem}
.sbar .nm small{display:block;font-weight:500;color:var(--muted);font-size:.74rem;font-family:var(--font-body)}
.track{height:10px;border-radius:6px;background:#EDEDF0;overflow:hidden}
.track>i{display:block;height:100%;border-radius:6px}
.track.dim{background:repeating-linear-gradient(135deg,#f2f2f4,#f2f2f4 7px,#eaeaee 7px,#eaeaee 14px)}
.sbar .rt{font-family:var(--font-head);font-weight:700;white-space:nowrap}
.sbar .rt .tag{white-space:normal;line-height:1.25;display:inline-block}
.sbar .rt b{font-size:1.05rem}.sbar .rt small{color:var(--muted);font-weight:500}
.sbar .bs{font-size:.82rem;color:#4a4a4e}
.sbar .bs em{font-style:normal;color:var(--muted)}
@media(max-width:820px){.sbar{grid-template-columns:1fr 1fr;gap:8px}.sbar .nm{grid-column:1/3}.sbar .bs{grid-column:1/3}}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;font-family:var(--font-head)}
.tag.strong{background:var(--green-tint);color:#2f7d34}
.tag.ok{background:var(--amber-tint);color:#8a6400}
.tag.attention{background:var(--red-tint);color:#a12828}
.tag.na{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.tag.soon{background:var(--purple-tint);color:var(--purple)}

/* profiel */
.prof{width:100%;border-collapse:collapse;margin-top:0;font-size:.93rem;min-width:560px}
.prof th{background:var(--purple);color:#fff;font-family:var(--font-head);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:9px 12px}
.prof td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}
.prof td.k{font-family:var(--font-head);font-weight:700;width:23%}
.prof .st{white-space:nowrap}
.prof tr.unconfirmed td{background:var(--amber-tint)}
.prof tr.wrong td{background:var(--red-tint)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
table.data{border-collapse:collapse;width:100%;min-width:660px;font-size:.88rem}
table.data th{background:var(--purple);color:#fff;font-family:var(--font-head);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:9px 12px;position:sticky;top:0}
table.data td{border-bottom:1px solid var(--line);padding:9px 12px;vertical-align:top}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data tr.win td{background:var(--green-tint)}
table.data tr:last-child td{border-bottom:none}
table.data code{font-size:.82em;color:var(--purple);word-break:break-all}

/* adviesblokken */
.adv{border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-top:14px;background:#fff}
.adv .ah{display:flex;gap:12px;align-items:baseline}
.adv .an{font-family:var(--font-head);font-weight:700;color:#fff;background:var(--purple);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-size:.82rem;flex:none}
.adv h3{font-size:1.06rem}
.adv .rows{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin-top:12px;font-size:.9rem}
@media(max-width:680px){.adv .rows{grid-template-columns:1fr;gap:2px 0}.adv .rows .k{margin-top:8px}}
.adv .rows .k{font-family:var(--font-head);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}

/* dimensiehoofdstuk */
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--surface);padding-bottom:14px;margin-bottom:10px}
.chead .no{font-family:var(--font-head);font-weight:700;color:var(--purple);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.meas{margin-top:14px}
.meas .mrow{display:grid;grid-template-columns:1fr 150px;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.meas .mrow:last-child{border-bottom:none}
.meas .mv{font-family:var(--font-head);font-weight:700}
.meas .mk{font-size:.93rem}
.meas .mk .sub{display:block;font-size:.76rem;color:var(--muted);margin-top:1px}
@media(max-width:680px){.meas .mrow{grid-template-columns:1fr;gap:2px}.meas .mv{order:-1}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:680px){.judge{grid-template-columns:1fr}}
.box{border-radius:0 11px 11px 0;padding:14px 16px}
.box.says{border-left:4px solid var(--green);background:var(--green-tint)}
.box.saysnot{border-left:4px solid var(--amber);background:var(--amber-tint)}
.box .l{font-family:var(--font-head);font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.06em}
.box.says .l{color:#2f7d34}.box.saysnot .l{color:#8a6400}
.box p{margin:.35rem 0 0;font-size:.92rem}
.actions{list-style:none;padding:0;margin:10px 0 0}
.actions li{position:relative;padding:11px 15px 11px 38px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff}
.actions li::before{content:"→";position:absolute;left:15px;top:11px;color:var(--green);font-weight:700;font-family:var(--font-head)}
.actions li .t{font-weight:700;font-family:var(--font-head)}
.actions li .d{font-size:.9rem;color:#4a4a4e;margin-top:2px}
.platlink{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--purple-tint);border-radius:10px;padding:11px 15px;font-size:.88rem}
.platlink .ic{width:20px;height:20px;flex:0 0 auto;color:var(--purple)}
.nogo{border:2px dashed var(--red);background:var(--red-tint);border-radius:11px;padding:14px 16px;font-weight:700;color:#a12828;margin-top:12px}
.note{border-left:4px solid var(--purple);background:var(--surface);border-radius:0 10px 10px 0;padding:13px 16px;font-size:.92rem;margin-top:16px}
.note.open{border-left-color:var(--amber);background:var(--amber-tint)}

/* planning */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
@media(max-width:680px){.plan{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.col .hd{background:var(--purple);color:#fff;padding:10px 14px;font-family:var(--font-head);font-weight:700;font-size:.94rem}
.col .hd small{display:block;font-weight:500;color:rgba(255,255,255,.82);font-size:.72rem}
.col ul{margin:0;padding:12px 14px 14px 28px;font-size:.9rem}.col li{margin:6px 0}
.chan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media(max-width:680px){.chan{grid-template-columns:1fr}}
.chan .c{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff}
.chan .c h4{margin:0 0 4px}.chan .c p{font-size:.88rem;color:#4a4a4e;margin:0}
.footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.82rem}
.footer .wm{font-family:var(--font-head);font-weight:700;color:var(--purple)}
@media print{body{background:#fff}.deck{max-width:none;padding:0}.page{box-shadow:none;border:none;border-radius:0;margin:0;padding:20mm 16mm;page-break-after:always}@page{size:A4;margin:0}}
</style>
</head>

/* dimensiehoofdstukken */
function dimSection(ch){
  const ontbreekt=[];
  if(!ch.meting||!ch.meting.length) ontbreekt.push("de meting");
  if(!ch.advies||!ch.advies.length) ontbreekt.push("het advies");
  if(!ch.zegt) ontbreekt.push("de uitleg");
  if(ontbreekt.length){
    const lijst = ontbreekt.length===1 ? ontbreekt[0] : ontbreekt.slice(0,-1).join(", ")+" en "+ontbreekt.slice(-1);
    const ww = ontbreekt.length===1 ? "ontbreekt" : "ontbreken";
    add(`<section class="page" id="${ch.id}">
      <div class="chead"><div><div class="no">Hoofdstuk ${ch.no} · ${esc(ch.dim)}</div><h2>${esc(ch.name)}</h2></div></div>
      <div class="nogo">Het cijfer ${num(ch.score)} wordt hier niet getoond omdat ${lijst} ${ww}. Een score zonder onderbouwing en zonder advies zetten wij niet in een rapport.</div>
    </section>`);
    return;
  }
  add(`
  <section class="page" id="${ch.id}">
    <div class="chead">
      <div><div class="no">Hoofdstuk ${ch.no} · ${esc(ch.dim)}</div><h2>${esc(ch.name)}</h2></div>
      <span class="tag ${ch.status}" style="font-size:.9rem;padding:6px 14px">${statusTag[ch.status]} · ${num(ch.score)}/10</span>
    </div>
    <p class="lead">${esc(ch.lead)}</p>

    <h3 style="margin-top:20px">Waarop dit cijfer gemeten is</h3>
    <div class="meas">
      ${ch.meting.map(m=>`<div class="mrow">
        <div class="mk">${esc(m.k)}<span class="sub">${esc(m.sub||"")}</span></div>
        <div><div class="mv">${esc(m.v)}</div><div class="src">${esc(m.bron)}</div></div>
      </div>`).join("")}
    </div>

    <div class="judge">
      <div class="box says"><div class="l">Wat het cijfer zegt</div><p>${esc(ch.zegt)}</p></div>
      <div class="box saysnot"><div class="l">Wat het cijfer niet zegt</div><p>${esc(ch.zegt_niet)}</p></div>
    </div>

    ${ch.bewijs&&ch.bewijs.length?`<h3 style="margin-top:22px">Wat wij in uw eigen data zien</h3>
      <ul class="actions" style="margin-top:8px">${ch.bewijs.map(b=>`<li><div class="t">${esc(b.t)}</div><div class="d">${esc(b.d)}</div></li>`).join("")}</ul>`:""}

    <h3 style="margin-top:22px">Wat wij hier concreet doen</h3>
    <ul class="actions">${ch.advies.map(a=>`<li><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div></li>`).join("")}</ul>

    <div class="platlink"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <div>${esc(ch.platform)} <a href="${esc(DATA.platform_url)}">Bekijk in het platform</a></div></div>
  </section>`);
}
