<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<title>Website-audit — CK Service</title>
<!--
  ECHTE-KLANT AUDIT (nulmeting) — CK Service (ckservice.be)
  ---------------------------------------------------------
  Alle cijfers zijn LIVE uit Sherlock OS op 10-08-2026 (GSC 90d, GA4 90d, keyword_data,
  topics/relevance). Niets is verzonnen. Waar een bron nog niet uitleest, staat dat
  eerlijk ("koppeling herstellen" / "nog niet gemeten"), nooit een verzonnen getal.
  Trend = leeg: dit is de eerste meting (nulmeting/baseline).

  Verwerkte feedback (Jef, 10/8): klant-taal, geen jargon; "geen webshop" weg; doel &
  contactwijze samengevoegd + herkomst getoond; richtcijfer klein + tooltip; €-onderbouwing
  = CPC × gemiste vraag (advertentiewaarde), exact zodra conversiewaarde gemeten;
  vaste volgorde techniek→content→autoriteit met verkooppagina's/lokaal VROEG;
  planning = "aan te passen in samenspraak met uw consultant"; visualisaties toegevoegd;
  detaildata → link naar platform.
-->
<style>
:root{
  --purple:#662483; --green:#6BB869; --white:#FFFFFF;
  --ink:#232326; --muted:#6B6B6B; --line:#E6E6EA; --surface:#F6F6F8;
  --green-tint:rgba(107,184,105,.14); --purple-tint:rgba(102,36,131,.08);
  --amber:#B8860B; --amber-tint:rgba(184,134,11,.12); --red:#b22828;
  --font-head:"Raleway",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-body:"Open Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --shadow:0 1px 2px rgba(16,16,20,.05),0 8px 26px rgba(16,16,20,.07);
}
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;500;700&family=Open+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#EAEAEE;color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;color:var(--ink)}
h1{font-size:2.7rem;line-height:1.06}h2{font-size:1.55rem;line-height:1.15}h3{font-size:1.18rem}h4{font-size:1rem}
p{margin:.55rem 0}a{color:var(--purple);font-weight:600}
.accent-green{color:var(--green)}
.deck{max-width:1000px;margin:0 auto;padding:26px 16px 64px}
.page{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 24px;padding:44px 48px;position:relative;overflow:hidden}
.kicker{font-family:var(--font-head);font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;margin:0 0 8px}
.lead{font-size:1.06rem;color:#3c3c40;max-width:66ch}
.small{font-size:.85rem;color:var(--muted)}
.src{font-size:.72rem;color:var(--muted);font-style:italic}

/* cover */
.cover{background:var(--purple);color:#fff;padding:0;border:none}
.cover .in{position:relative;z-index:2;padding:56px 50px 52px}
.cover h1{color:#fff;margin:.4rem 0 .5rem}
.cover .url{font-family:var(--font-head);font-weight:700;color:var(--green);font-size:1.35rem}
.cover .company{color:rgba(255,255,255,.82);font-size:1.02rem;margin-top:2px}
.cover .wm{font-family:var(--font-head);font-weight:700;color:#fff;font-size:1.25rem}
.cover .wm small{display:block;font-weight:500;font-size:.6rem;letter-spacing:.34em;color:var(--green);margin-top:2px}
.cover .meta{margin-top:34px;color:rgba(255,255,255,.9);font-size:.92rem}
.cover .sliver{position:absolute;top:0;right:0;width:44%;height:100%;background:linear-gradient(115deg,transparent 0 48%,var(--green) 48% 49%,transparent 49%);opacity:.9;z-index:1}
.cover svg.net{position:absolute;top:0;right:0;width:320px;height:210px;z-index:1;opacity:.5}

.toc{list-style:none;padding:0;margin:14px 0 0}
.toc li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.toc li .no{font-family:var(--font-head);font-weight:700;color:var(--purple);width:26px}
.toc li .tt{font-family:var(--font-head);font-weight:700}
.toc li .ds{color:var(--muted);font-size:.9rem;margin-left:auto;text-align:right;max-width:48%}

.ctx{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(max-width:680px){.ctx{grid-template-columns:1fr}}
.ctx .cell{background:var(--surface);border-radius:10px;padding:13px 15px}
.ctx .cell .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--font-head);font-weight:700}
.ctx .cell .v{font-weight:600;margin-top:2px}
.ctx .cell .v .badge{display:inline-block;background:var(--green-tint);color:#2f7d34;border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;font-family:var(--font-head);margin-left:6px}

/* score bars */
.sbar{display:grid;grid-template-columns:200px 1fr 118px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
@media(max-width:680px){.sbar{grid-template-columns:130px 1fr 96px}}
.sbar .nm{font-family:var(--font-head);font-weight:700;font-size:.94rem}
.sbar .nm small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.track{height:12px;border-radius:7px;background:#EEE;overflow:hidden;position:relative}
.track>i{display:block;height:100%;border-radius:7px}
.track.dim{background:repeating-linear-gradient(135deg,#f2f2f4,#f2f2f4 7px,#eaeaee 7px,#eaeaee 14px)}
.sbar .rt{text-align:right;font-family:var(--font-head);font-weight:700;white-space:nowrap}
.sbar .rt b{font-size:1.05rem}.sbar .rt small{color:var(--muted);font-weight:500}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;font-family:var(--font-head)}
.tag.strong{background:var(--green-tint);color:#2f7d34}
.tag.ok{background:var(--amber-tint);color:#8a6400}
.tag.attention{background:rgba(178,40,40,.10);color:#a12828}
.tag.na{background:var(--surface);color:var(--muted);border:1px dashed var(--line)}
.tag.soon{background:var(--purple-tint);color:var(--purple)}

.overall{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;cursor:help;position:relative}
.overall .lbl{font-size:.78rem;color:var(--muted);font-family:var(--font-head);font-weight:700}
.overall .pill{font-family:var(--font-head);font-weight:700;background:var(--purple);color:#fff;border-radius:999px;padding:3px 11px;font-size:.95rem}
.overall .tip{visibility:hidden;opacity:0;transition:.15s;position:absolute;top:calc(100% + 8px);left:0;width:320px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:11px 13px;font-size:.82rem;color:#444;z-index:5;font-weight:400;line-height:1.5}
.overall:hover .tip,.overall:focus .tip{visibility:visible;opacity:1}
.overall .tip b{color:var(--purple)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media(max-width:680px){.cols{grid-template-columns:1fr}}
.stack{list-style:none;padding:0;margin:8px 0 0}
.stack li{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:#fff}
.stack.win li{border-left:4px solid var(--green)}
.stack.watch li{border-left:4px solid var(--amber)}
.stack.opp li{border-left:4px solid var(--purple)}
.stack .t{font-family:var(--font-head);font-weight:700}
.stack .d{font-size:.9rem;color:#4a4a4e;margin-top:3px}
.value{display:inline-block;margin-top:8px;background:var(--green-tint);color:#2f7d34;border-radius:8px;padding:5px 10px;font-size:.82rem;font-weight:700;font-family:var(--font-head)}
.value small{font-weight:500;color:#3a7d3f}

.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
@media(max-width:680px){.layers{grid-template-columns:1fr}}
.layer{border:1px solid var(--line);border-radius:12px;padding:16px 17px;background:#fff}
.layer .n{font-family:var(--font-head);font-weight:700;font-size:1.6rem;color:var(--green);line-height:1}
.layer h4{margin:6px 0 4px}.layer p{font-size:.9rem;color:#4a4a4e;margin:0}

.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
@media(max-width:680px){.plan{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.col .hd{background:var(--purple);color:#fff;padding:10px 14px;font-family:var(--font-head);font-weight:700;font-size:.95rem}
.col .hd small{display:block;font-weight:500;color:rgba(255,255,255,.8);font-size:.72rem}
.col ul{margin:0;padding:12px 14px 14px 30px;font-size:.9rem}.col li{margin:6px 0}
.editnote{margin-top:12px;border-left:4px solid var(--green);background:var(--green-tint);border-radius:0 10px 10px 0;padding:11px 15px;font-size:.9rem}

.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--surface);padding-bottom:14px;margin-bottom:8px}
.chead .no{font-family:var(--font-head);font-weight:700;color:var(--purple);font-size:.9rem}
.microstats{display:flex;gap:26px;flex-wrap:wrap;margin:14px 0;padding:12px 16px;background:var(--surface);border-radius:11px}
.microstats .m .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--font-head);font-weight:700}
.microstats .m .v{font-family:var(--font-head);font-weight:700;font-size:1.15rem;margin-top:1px}
.finding{font-size:1rem;color:#3c3c40;max-width:70ch}
.actions{list-style:none;padding:0;margin:12px 0 0}
.actions li{position:relative;padding:11px 15px 11px 40px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff}
.actions li::before{content:"→";position:absolute;left:15px;top:11px;color:var(--green);font-weight:700;font-family:var(--font-head)}
.actions li .t{font-weight:700;font-family:var(--font-head)}.actions li .d{font-size:.9rem;color:#4a4a4e;margin-top:2px}
.platlink{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--purple-tint);border-radius:10px;padding:11px 15px;font-size:.9rem}
.platlink .ic{width:22px;height:22px;flex:0 0 auto;color:var(--purple)}

/* viz */
.viz{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;align-items:center}
@media(max-width:680px){.viz{grid-template-columns:1fr}}
.leak{display:flex;flex-direction:column;gap:10px}
.leak .row .lab{font-size:.82rem;color:var(--muted);font-family:var(--font-head);font-weight:700;display:flex;justify-content:space-between}
.leak .bar{height:26px;border-radius:7px;margin-top:3px}
.leak .bar.imp{background:var(--purple-tint);border:1px solid rgba(102,36,131,.25)}
.leak .bar.clk{background:var(--green)}
.buckets{display:flex;flex-direction:column;gap:8px}
.bk{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:.82rem}
.bk .kb{font-family:var(--font-head);font-weight:700;color:#4a4a4e}
.bk .tb{height:16px;border-radius:6px;background:#EEE;overflow:hidden}
.bk .tb>i{display:block;height:100%}
.bk .nb{font-family:var(--font-head);font-weight:700;text-align:right}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{font-size:.86rem}
.legend .li{display:flex;align-items:center;gap:8px;margin:5px 0}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.callout{background:var(--amber-tint);border:1px dashed var(--amber);border-radius:10px;padding:8px 12px;font-size:.84rem;color:#6a5100;font-weight:600;margin-top:10px}

.fams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:680px){.fams{grid-template-columns:1fr}}
.fam{border:1px solid var(--line);border-radius:12px;padding:15px 17px;background:#fff}
.fam .fh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fam .fl{font-family:var(--font-head);font-weight:700}.fam p{font-size:.9rem;color:#4a4a4e;margin:8px 0 0}
.diagbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:680px){.diagbox{grid-template-columns:1fr}}
.box{border-radius:0 11px 11px 0;padding:14px 16px}
.box.diag{border-left:4px solid var(--purple);background:var(--purple-tint)}
.box.treat{border-left:4px solid var(--green);background:var(--green-tint)}
.box .l{font-family:var(--font-head);font-weight:700;text-transform:uppercase;font-size:.7rem;letter-spacing:.06em}
.box.diag .l{color:var(--purple)}.box.treat .l{color:#2f7d34}

.chan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
@media(max-width:680px){.chan{grid-template-columns:1fr}}
.chan .c{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff}
.chan .c h4{margin:0 0 4px}.chan .c p{font-size:.88rem;color:#4a4a4e;margin:0}

.footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.82rem}
.footer .wm{font-family:var(--font-head);font-weight:700;color:var(--purple)}
@media print{body{background:#fff}.deck{max-width:none;padding:0}.page{box-shadow:none;border:none;border-radius:0;margin:0;padding:24mm 18mm;page-break-after:always}.overall .tip{display:none}@page{size:A4;margin:0}}
</style>
</head>

<script>
